# Render Blueprint: https://render.com/docs/blueprint-spec
# After connect: set GitHub repo, or use "Apply" from dashboard with this file.

databases:
  - name: aajhee-db
    databaseName: aajhee
    user: aajhee
    plan: free

services:
  - type: web
    name: aajhee-backend
    runtime: python
    plan: free
    buildCommand: pip install --retries 15 --timeout 120 -r requirements.txt && python manage.py collectstatic --noinput
    # Free tier: preDeployCommand is not supported — run migrations at startup instead.
    startCommand: python manage.py migrate --noinput && python manage.py ensure_superuser && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: aajhee-db
          property: connectionString
      # Persistent uploads (logos/images). Local disk on Render is ephemeral.
      # Create a Cloudflare R2 or AWS S3 bucket, then set these in the dashboard.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
      - key: AWS_QUERYSTRING_AUTH
        value: "False"
      # Firebase Admin (phone / Google / Apple → JWT). Paste the full
      # service-account JSON string in the Render dashboard.
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
